<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found — Vrikalytics</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="stylesheet" href="css/styles.css" />
  <script>(function(){var t=localStorage.getItem('vk-theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');}());</script>
  <style>
    .error-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      gap: 1.5rem;
    }
    .error-code {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(5rem, 20vw, 10rem);
      font-weight: 700;
      line-height: 1;
      color: var(--accent);
      opacity: 0.25;
    }
    .error-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(1.5rem, 4vw, 2.25rem);
      font-weight: 700;
      color: var(--text-primary);
    }
    .error-body {
      font-size: 1rem;
      color: var(--text-secondary);
      max-width: 36ch;
    }
    .error-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.75rem;
      background: var(--accent);
      color: var(--bg-primary);
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      font-size: 0.9rem;
      border-radius: 6px;
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .error-link:hover { opacity: 0.85; }
  </style>
</head>
<body>
  <main class="error-page">
    <div class="error-code" aria-hidden="true">404</div>
    <h1 class="error-title">Page not found</h1>
    <p class="error-body">The page you're looking for doesn't exist or has been moved.</p>
    <a href="/" class="error-link">Back to home</a>
  </main>
</body>
</html>
